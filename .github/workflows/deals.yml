name: PC Deals Hunter

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تجربة بدون إرسال لتلقرام"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deals
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hunt deals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HTTPS_PROXY: ${{ secrets.SCRAPER_PROXY }}
        run: python deals_bot.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save state
        run: |
          git config user.name  "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update price history"
            git pull --rebase --autostash origin main || git rebase --abort
            git push || (sleep 5 && git pull --rebase origin main && git push)
          fi
