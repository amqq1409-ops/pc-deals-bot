# ترتيب الفئات مهم: الأدق أولاً حتى لا يلتبس تصنيف المنتج
categories:
  gpu:
    label: "كرت شاشة"
    emoji: "🎮"
    queries: ["RTX 5080 graphics card", "RTX 4070 Super graphics card", "Radeon RX 9070 graphics card", "graphics card"]
    include_any: ["rtx", "gtx", "radeon", "rx 6", "rx 7", "rx 9", "graphics card", "gpu", "arc a", "arc b"]
    exclude_any: ["laptop", "notebook", "cable", "bracket", "riser", "support", "holder", "backplate",
                  "water block", "fan only", "adapter", "extension", "pc case", "gaming pc", "desktop pc",
                  "prebuilt", "monitor", "mini pc"]
    premium_keywords: ["rtx 5090", "rtx 5080", "rtx 5070 ti", "rtx 4090", "rtx 4080", "rx 9070 xt", "rx 7900"]
    premium_ref_price: 3000
    min_price: 400
    max_price: 15000

  monitor:
