# ======= إعدادات صائد صفقات البي سي — وضع "الجودة العالية أولاً" =======

stores:            # فعّل/عطّل المتاجر
  amazon_sa: true
  noon: true
  jarir: true
  extra: false      # تجريبي: غير مجرَّب على الموقع الحي

# أقل خصم مطلوب حسب جودة المنتج (كلما قلّت الجودة اشترطنا خصماً أكبر)
tier_min_discount:
  premium: 50       # 💎 فئة ممتازة: خصم 50% فأكثر
  high: 60          # ⭐ ماركة موثوقة عادية
  basic: 75         # 🔹 ماركة غير معروفة: خصم 75% فأكثر + تقييمات قوية
basic_min_rating: 4.2
basic_min_reviews: 50

min_discount_pct: 50        # احتياطي فقط
min_score: 60               # أقل درجة جودة/سعر (من 100)
max_results_per_run: 8      # أقصى عدد رسائل في كل تشغيل (الممتاز يُرسل أولاً)
resend_if_drop_pct: 5       # أعد إرسال نفس المنتج فقط لو نزل سعره أكثر من هذه النسبة
max_discount_suspicious: 92 # خصم أعلى من هذا بلا تقييمات كافية = غالباً سعر أصلي وهمي
store_time_budget_sec: 330  # أقصى وقت لكل متجر

weights:
  discount: 45
  rating: 25
  reviews: 10
  brand: 10
  price_history: 10

min_rating: 4.0
min_reviews: 10

# مواسم التخفيضات: التواريخ الرسمية للمناسبات مؤكدة، أما نافذة التخفيض الفعلية في كل متجر فتقديرية، عدّلها متى شئت
season_extra_results: 7     # أثناء الموسم يرسل عدداً أكبر من الصفقات
seasons:
  - { name: "يوم العزاب 11.11",        start: "2026-11-09", end: "2026-11-12" }
