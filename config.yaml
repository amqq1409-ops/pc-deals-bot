stores:
  amazon_sa: true
  noon: true
  jarir: true
  extra: false

custom_stores:
  - key: steam
    enabled: true
    type: steam
    name_ar: "ستيم"
    experimental: false

  - key: amazon_us
    enabled: true
    type: amazon
    base: "https://www.amazon.com"
    rate_to_sar: 3.75
    imported: true
    name_ar: "أمازون العالمية"
    experimental: false

categories:
  gaming:
    queries:
      - "specials"
      - "pc game"
      - "gaming"
    include_any:
      - steam
      - game
      - gaming
      - pc game
    exclude_any:
      - keyboard
      - mouse
      - monitor
    min_price: 20
    max_price: 500
    label: "ألعاب"
    emoji: "🎲"
    premium_keywords:
      - deluxe
      - edition

  keyboards:
    queries:
      - "keyboard"
      - "gaming keyboard"
      - "mechanical keyboard"
      - "rgb keyboard"
    include_any:
      - keyboard
      - gaming
      - mechanical
      - rgb
    exclude_any:
      - mouse
      - monitor
      - headset
    min_price: 100
    max_price: 3000
    label: "لوحة مفاتيح"
    emoji: "⌨️"
    premium_keywords:
      - mechanical
      - rgb
      - wireless
      - gaming

  mice:
    queries:
      - "mouse"
      - "gaming mouse"
      - "wireless mouse"
    include_any:
      - mouse
      - gaming
      - wireless
    exclude_any:
      - keyboard
      - monitor
      - headset
    min_price: 50
    max_price: 2000
    label: "ماوس"
    emoji: "🖱️"
    premium_keywords:
      - wireless
      - gaming
      - ergonomic

  monitors:
    queries:
      - "monitor"
      - "gaming monitor"
      - "ips monitor"
    include_any:
      - monitor
      - gaming
      - ips
    exclude_any:
      - keyboard
      - mouse
      - headset
    min_price: 300
    max_price: 5000
    label: "شاشة"
    emoji: "🖥️"
    premium_keywords:
      - ips
      - 144hz
      - 165hz

